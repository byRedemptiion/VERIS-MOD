name: Release

# Publier une version : changer AppInfo.Version (src/Services/Core.cs) et pousser sur main.
# Si la Release vX.Y.Z n'existe pas encore, GitHub compile VERIS MOD, fabrique le setup,
# calcule son SHA-256 et crée la Release (avec latest.json lu par l'application).
# Branche « test » : même chaîne, mais en pré-version (vX.Y.Z-test.N), sans latest.json :
# l'application installée ne la propose jamais comme mise à jour.
on:
  push:
    branches: [main, test]
    paths: ['src/**', 'installer/**', 'RELEASE_NOTES.txt', 'TEST_NOTES.txt', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Lire la version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $core = Get-Content src/Services/Core.cs -Raw
          if ($core -notmatch 'Version = "(\d+\.\d+\.\d+)"') { throw 'AppInfo.Version introuvable dans Core.cs' }
          $v = $Matches[1]
          "version=$v" >> $env:GITHUB_OUTPUT
          $isTest = '${{ github.ref_name }}' -eq 'test'
          if ($isTest) {
            $tag = "v$v-test.${{ github.run_number }}"
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "test=true" >> $env:GITHUB_OUTPUT
            "skip=false" >> $env:GITHUB_OUTPUT
            Write-Host "Build de TEST : $tag (pré-version)."
            exit 0
          }
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "test=false" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "La Release v$v existe déjà : rien à publier."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Compiler
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet publish src/Audely.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -o publish 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Les erreurs de compilation deviennent des annotations lisibles dans la page du run.
            $errs = Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 40
            foreach ($e in $errs) {
              $msg = ($e -replace '\[[^\]]*\]\s*$', '') -replace '%', '%25'
              Write-Host "::error::$msg"
            }
            exit $code
          }

      - name: Installer NSIS
        if: steps.ver.outputs.skip != 'true'
        run: choco install nsis -y --no-progress

      - name: Fabriquer le setup
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $publish = (Resolve-Path publish).Path
          Set-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DAPP_VERSION=$v" "/DAPP_VERSION4=$v.0" "/DPUBLISH_DIR=$publish" setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis a échoué' }

      - name: Fichiers de version
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $setup = Get-ChildItem installer -Filter 'VERIS_MOD_Setup_*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup introuvable' }
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content RELEASE_NOTES.txt -Raw -Encoding utf8).Trim()
          $tag = '${{ steps.ver.outputs.tag }}'
          $json = [ordered]@{
            version = $v
            url     = "https://github.com/${{ github.repository }}/releases/download/$tag/$($setup.Name)"
            sha256  = $sha
            notes   = $notes
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content latest.json

      - name: Publier la Release
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $setup = (Get-ChildItem installer -Filter 'VERIS_MOD_Setup_*.exe' | Select-Object -First 1).FullName
          if ('${{ steps.ver.outputs.test }}' -eq 'true') {
            # Pré-version de test : pas de latest.json, donc jamais proposée aux mises à jour automatiques.
            gh release create $tag $setup --prerelease --title "VERIS MOD $v — VERSION DE TEST" --notes-file TEST_NOTES.txt --target '${{ github.sha }}'
          } else {
            gh release create $tag $setup latest.json --title "VERIS MOD $v" --notes-file RELEASE_NOTES.txt --target '${{ github.sha }}'
          }
